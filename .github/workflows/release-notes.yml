# Enrich a published GitHub release with package size, AI highlights, and commits.
name: Release notes

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.9.1). Empty = v + package.json version."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  enrich:
    name: Enrich release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json','utf8')).version)")"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      # Optional AI: OPENAI_API_KEY / ANTHROPIC_API_KEY, else CURSOR_API_KEY via SDK.
      # Without any of those, highlights fall back to filtered commit subjects.
      - name: Install Cursor SDK for AI summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            npm install --no-save @cursor/sdk
          fi

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: node scripts/generate-release-notes.mjs --tag "${{ steps.tag.outputs.tag }}" --update
